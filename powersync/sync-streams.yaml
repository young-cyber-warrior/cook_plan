config:
  edition: 3

with:
  accessible_week_ids: |
    SELECT id FROM weeks
    WHERE deleted = false
      AND (
        owner_id = auth.user_id()
        OR owner_id IN (
          SELECT user_id FROM family_members
          WHERE deleted = false
            AND family_id IN (
              SELECT family_id FROM family_members
              WHERE user_id = auth.user_id() AND deleted = false
            )
        )
        OR id IN (
          SELECT resource_id FROM shares
          WHERE user_id = auth.user_id() AND resource_type = 'week' AND deleted = false
        )
      )
  accessible_recipe_ids: |
    SELECT id FROM recipes
    WHERE deleted = false
      AND (
        owner_id = auth.user_id()
        OR owner_id IN (
          SELECT user_id FROM family_members
          WHERE deleted = false
            AND family_id IN (
              SELECT family_id FROM family_members
              WHERE user_id = auth.user_id() AND deleted = false
            )
        )
        OR id IN (
          SELECT resource_id FROM shares
          WHERE user_id = auth.user_id() AND resource_type = 'recipe' AND deleted = false
        )
        OR id IN (
          SELECT recipe_id FROM meals
          WHERE deleted = false
            AND week_id IN (
              SELECT id FROM weeks
              WHERE deleted = false
                AND (
                  owner_id = auth.user_id()
                  OR owner_id IN (
                    SELECT user_id FROM family_members
                    WHERE deleted = false
                      AND family_id IN (
                        SELECT family_id FROM family_members
                        WHERE user_id = auth.user_id() AND deleted = false
                      )
                  )
                  OR id IN (
                    SELECT resource_id FROM shares
                    WHERE user_id = auth.user_id() AND resource_type = 'week' AND deleted = false
                  )
                )
            )
        )
      )
  accessible_list_ids: |
    SELECT id FROM grocery_lists
    WHERE deleted = false
      AND (
        owner_id = auth.user_id()
        OR owner_id IN (
          SELECT user_id FROM family_members
          WHERE deleted = false
            AND family_id IN (
              SELECT family_id FROM family_members
              WHERE user_id = auth.user_id() AND deleted = false
            )
        )
        OR id IN (
          SELECT resource_id FROM shares
          WHERE user_id = auth.user_id() AND resource_type = 'grocery_list' AND deleted = false
        )
      )

streams:
  weeks:
    auto_subscribe: true
    queries:
      - SELECT * FROM weeks WHERE id IN accessible_week_ids
      - SELECT * FROM meals WHERE deleted = false AND week_id IN accessible_week_ids

  recipes:
    auto_subscribe: true
    queries:
      - SELECT * FROM recipes WHERE id IN accessible_recipe_ids
      - SELECT * FROM recipe_ingredients WHERE deleted = false AND recipe_id IN accessible_recipe_ids
      - SELECT * FROM recipe_photos WHERE deleted = false AND recipe_id IN accessible_recipe_ids
      - |
        SELECT * FROM categories
        WHERE deleted = false
          AND (
            owner_id = auth.user_id()
            OR owner_id IN (
              SELECT user_id FROM family_members
              WHERE deleted = false
                AND family_id IN (
                  SELECT family_id FROM family_members
                  WHERE user_id = auth.user_id() AND deleted = false
                )
            )
            OR id IN (SELECT category_id FROM recipes WHERE id IN accessible_recipe_ids)
          )

  grocery:
    auto_subscribe: true
    queries:
      - SELECT * FROM grocery_lists WHERE id IN accessible_list_ids
      - SELECT * FROM grocery_items WHERE deleted = false AND list_id IN accessible_list_ids

  family:
    auto_subscribe: true
    queries:
      - |
        SELECT * FROM families
        WHERE deleted = false
          AND id IN (
            SELECT family_id FROM family_members
            WHERE user_id = auth.user_id() AND deleted = false
          )
      - |
        SELECT * FROM family_members
        WHERE deleted = false
          AND family_id IN (
            SELECT family_id FROM family_members
            WHERE user_id = auth.user_id() AND deleted = false
          )
      - |
        SELECT * FROM invites
        WHERE deleted = false
          AND family_id IN (
            SELECT family_id FROM family_members
            WHERE user_id = auth.user_id() AND deleted = false AND role = 'owner'
          )

  shares:
    auto_subscribe: true
    query: |
      SELECT * FROM shares
      WHERE deleted = false
        AND (owner_id = auth.user_id() OR user_id = auth.user_id())

  personal:
    auto_subscribe: true
    queries:
      - SELECT * FROM meal_adjustments WHERE deleted = false AND owner_id = auth.user_id()
      - SELECT * FROM day_extras WHERE deleted = false AND owner_id = auth.user_id()
